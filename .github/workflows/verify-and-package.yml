name: Verify and package

on:
  push:
    tags:
      - v1.0.0
  workflow_dispatch:
    inputs:
      package:
        description: Create unsigned release archives after checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag version
        if: github.event_name == 'push'
        run: |
          python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]; expected = f"v{version}"; actual = os.environ["GITHUB_REF_NAME"]; assert actual == expected, f"Tag {actual} does not match package version {expected}"; print(f"Verified {actual}")'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config liblzma-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Packaging fixtures (no binary execution)
        run: python -m unittest discover -s tools -p test_tools.py -v
      - name: Offline fixtures and integration tests
        run: cargo test --locked --features test-support --target ${{ matrix.target }}
      - name: Static Rust analysis
        run: cargo clippy --locked --all-targets --features test-support --target ${{ matrix.target }} -- -D warnings
      - name: Release binary
        if: github.event_name == 'push' || inputs.package
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --bin rusty-dlp --target ${{ matrix.target }}
      - name: Verify Windows application version
        if: (github.event_name == 'push' || inputs.package) && runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\release\rusty-dlp.exe'
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'rusty-dlp-version.txt'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'rusty-dlp-version-error.txt'
          $process = Start-Process -FilePath $binary -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $output = (Get-Content -LiteralPath $stdoutPath -Raw).Trim()
          if ($process.ExitCode -ne 0 -or $output -ne 'rusty_dlp 1.0.0') { throw "Unexpected version output: $output" }
      - name: Package unsigned artifact
        if: github.event_name == 'push' || inputs.package
        run: python tools/package.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - name: Windows installer
        if: (github.event_name == 'push' || inputs.package) && runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            $toolRoot = Join-Path $env:RUNNER_TEMP 'inno'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
            $signature = Get-AuthenticodeSignature -LiteralPath $download
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Unexpected compiler publisher' }
            $process = Start-Process -FilePath $download -ArgumentList @('/PORTABLE=1', '/VERYSILENT', '/CURRENTUSER', '/SP-', '/NORESTART', ('/DIR="' + $toolRoot + '"')) -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw 'Compiler setup failed' }
            $compiler = Join-Path $toolRoot 'ISCC.exe'
          }
          python tools/build_installer.py --compiler $compiler
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.package
        with:
          name: rusty-dlp-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rusty-dlp-*
          path: release-assets
          merge-multiple: true
      - name: Verify release asset names and checksums
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")

          expected = {
              f"rusty_dlp-{version}-windows-x64-setup.exe",
              f"rusty-dlp-{version}-windows-x86_64-portable.zip",
              f"rusty-dlp-{version}-linux-x86_64.tar.gz",
              f"rusty-dlp-{version}-macos-x86_64.zip",
              f"rusty-dlp-{version}-macos-aarch64.zip",
          }
          root = pathlib.Path("release-assets")
          assets = {path.name: path for path in root.iterdir() if path.is_file()}
          expected_files = expected | {f"{name}.sha256" for name in expected}
          if set(assets) != expected_files:
              raise SystemExit(f"Unexpected release assets. Expected {sorted(expected_files)}, got {sorted(assets)}")

          for name in sorted(expected):
              asset = assets[name]
              fields = assets[f"{name}.sha256"].read_text().split()
              actual = hashlib.sha256(asset.read_bytes()).hexdigest()
              if len(fields) != 2 or fields[1] != name or fields[0] != actual:
                  raise SystemExit(f"Checksum mismatch for {name}")
          print(f"Verified {len(expected)} release assets and SHA-256 sidecars")
          PY
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.exe release-assets/*.zip release-assets/*.tar.gz release-assets/*.sha256 --verify-tag --title "rusty_dlp $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES_1.0.0.md --latest
