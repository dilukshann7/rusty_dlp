[package]
name = "rusty-dlp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native desktop download manager for yt-dlp"
license = "MIT"
autobins = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "image-without-codecs", "x11", "wayland", "linux-theme-detection", "crisp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "fs", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = "0.1"
directories = "6"
fs2 = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
thiserror = "2"
rfd = "0.15"
open = "5"
dark-light = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "fake-downloader"
path = "tests/support/fake_downloader.rs"
required-features = ["test-support"]

[features]
test-support = []

[profile.release]
lto = "thin"
strip = "debuginfo"
